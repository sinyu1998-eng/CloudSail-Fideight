services:
  # CloudSail × Fideight 全站（静态页 + FastAPI 后端）
  - type: web
    name: cloudsail-fideight
    runtime: python
    plan: free            # 之后可升 starter
    rootDir: render
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
